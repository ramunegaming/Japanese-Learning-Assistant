<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Learning Assistant</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Add Kuroshiro scripts -->
    <script src="https://unpkg.com/kuroshiro@1.2.0/dist/kuroshiro.min.js"></script>
    <script src="https://unpkg.com/kuroshiro-analyzer-kuromoji@1.1.0/dist/kuroshiro-analyzer-kuromoji.min.js"></script>
    <!-- 1) Add WanaKana here so you can transliterate romaji→hiragana -->
    <script src="https://unpkg.com/wanakana@4.0.2/umd/wanakana.min.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="logo">
            <span class="logo-text">日本語</span>
            <span class="logo-subtext">Learning Assistant</span>
        </div>
        <div class="theme-toggle-wrapper">
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                <i class="fas fa-lightbulb"></i>
            </button>
        </div>
    </header>

    <nav>
        <div class="nav-container">
            <a href="#" class="nav-item active" data-page="search">
                <i class="fas fa-magnifying-glass"></i>
                Search
            </a>
            <a href="#" class="nav-item" data-page="examples">
                <i class="fas fa-align-left"></i>
                Sentence Examples
            </a>
            <a href="#" class="nav-item" data-page="history">
                <i class="fas fa-clock-rotate-left"></i>
                History
            </a>
            <a href="#" class="nav-item" data-page="favorites">
                <i class="fas fa-heart"></i>
                Favorites
            </a>
        </div>
    </nav>

    <main>
        <div id="search-page" class="page active">
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Enter Japanese or English...">
                    <button id="search-button">Search</button>
                </div>
                <div id="search-results" class="results-container"></div>
            </div>
        </div>

        <div id="examples-page" class="page">
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="example-search-input" placeholder="Enter Japanese or English...">
                    <button id="example-search-button">Search</button>
                </div>
                <div id="example-results" class="results-container"></div>
            </div>
        </div>

        <div id="history-page" class="page">
            <div id="history-list" class="results-container"></div>
        </div>

        <div id="favorites-page" class="page">
            <div class="search-container fav-container">
                <div id="fav-dates-carousel" class="dates-carousel" hidden>
                    <button class="dates-arrow" id="fav-dates-prev" aria-label="Previous dates">&lt;</button>
                    <div class="dates-strip" id="fav-dates-strip"></div>
                    <button class="dates-arrow" id="fav-dates-next" aria-label="Next dates">&gt;</button>
                </div>
                <div id="fc-dates-carousel" class="dates-carousel" hidden>
                    <button class="dates-arrow" id="fc-dates-prev" aria-label="Previous dates">&lt;</button>
                    <div class="dates-strip" id="fc-dates-strip"></div>
                    <button class="dates-arrow" id="fc-dates-next" aria-label="Next dates">&gt;</button>
                </div>
                <div class="fav-header">
                    <span class="fav-title">Favorites <span id="favorites-counter">0</span></span>
                    <button id="flashcards-toggle" class="flashcards-toggle" aria-label="Toggle flashcards" title="Flashcards">
                        <i class="fas fa-layer-group"></i>
                    </button>
                </div>
                <div id="favorites-list-wrap">
                    <div id="favorites-list" class="results-container"></div>
                </div>
                <div id="flashcards-setup" class="flashcards-pane" hidden>
                    <p class="flashcards-hint">Select cards, then press Begin.</p>
                    <div id="flashcards-checklist"></div>
                    <button id="flashcards-begin" class="flashcards-begin">Begin</button>
                </div>
                <div id="flashcards-viewer" class="flashcards-pane" hidden>
                    <div id="flashcard-status" class="flashcard-status"></div>
                    <div id="flashcard" class="flashcard" role="button" tabindex="0" aria-label="Flashcard, click to flip">
                        <div class="flashcard-icons">
                            <button id="flashcard-speak" class="icon-btn" aria-label="Play audio" title="Audio"><i class="fas fa-volume-up"></i></button>
                            <button id="flashcard-star" class="icon-btn" aria-label="Favorite" title="Favorite"><i class="fas fa-star"></i></button>
                        </div>
                        <div class="flashcard-inner">
                            <div id="flashcard-front" class="flashcard-face flashcard-front">
                                <div id="flashcard-jp" class="flashcard-jp"></div>
                            </div>
                            <div id="flashcard-back" class="flashcard-face flashcard-back">
                                <div id="flashcard-reading" class="flashcard-reading"></div>
                                <div id="flashcard-meaning" class="flashcard-meaning"></div>
                                <div id="flashcard-kanji" class="flashcard-kanji"></div>
                                <div id="flashcard-tags" class="flashcard-tags"></div>
                            </div>
                        </div>
                    </div>
                    <div class="flashcard-actions">
                        <button id="flashcards-edit" class="ghost-btn">Edit selection</button>
                        <button id="flashcard-next" class="flashcards-begin">Next -&gt;</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script type="module" src="examples.js"></script>
</body>
</html>
